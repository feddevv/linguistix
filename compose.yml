services:
  postgres_db:
    image: postgres:18
    restart: unless-stopped
    container_name: postgres_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-postgres_db}
    ports:
      - '${DB_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres_db}']
      interval: 5s
      timeout: 15s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql
      - ./init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres_db:5432/postgres_db}
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      postgres_db:
        condition: service_healthy
    command: sh -c "pnpm --filter api migrate up && node apps/api/dist/server.js"

volumes:
  pgdata:
