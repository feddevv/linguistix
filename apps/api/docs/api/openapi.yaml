openapi: 3.0.3

info:
  title: Linguistix API
  version: 0.0.1
  description: |
    HTTP API of the Linguistix platform.

    ## Error format
    Every JSON error response has the same shape:
    `{ "errorCode": ErrorCode, "message": string }`. `errorCode` is a stable,
    machine-readable code (see the `ErrorCode` schema); `message` is meant for
    humans and may change.

    | `errorCode`           | Status | Meaning                                                    |
    |-----------------------|--------|------------------------------------------------------------|
    | `VALIDATION_ERROR`    | 400    | Body or query failed validation, or the JSON is malformed  |
    | `VALIDATION_ERROR`    | 413    | Request body is larger than 100 KB                         |
    | `INVALID_CREDENTIALS` | 401    | Wrong email or password                                    |
    | `TOKEN_NOT_FOUND`     | 401    | Refresh token cookie is missing                            |
    | `INVALID_TOKEN`       | 401    | Refresh token is invalid, expired or already used          |
    | `USER_NOT_FOUND`      | 404    | The user of the session no longer exists                   |
    | `EMAIL_IN_USE`        | 409    | A user with this email already exists                      |
    | `REQUEST_LIMIT`       | 429    | The client IP exceeded a rate limit                        |
    | `COOLDOWN`            | 429    | The same email was used less than 60 seconds ago           |
    | `SERVER_ERROR`        | 500    | Unexpected server error                                    |

    Validation errors report **only the first** failing rule. Fields are checked
    in the order in which they are listed in each request schema; cross-field
    rules (such as the password confirmation match) run last.

    The Google sign-in endpoints and `GET /api/auth/verify-email` never return
    JSON errors for their own failures. They redirect the browser to the
    frontend with an `error` query parameter instead (see
    `GET /api/auth/google/callback` and `GET /api/auth/verify-email`). Only a
    malformed query gets a JSON `400`.

    `429` responses add an optional `retryAfter` field (see the
    `TooManyRequests` schema).

    ## Rate limiting
    Limits are counted per client IP (IPv6 addresses are grouped by `/56`
    subnet) and stored in Redis. The server trusts **one** proxy hop: the
    client IP is the last entry of `X-Forwarded-For`, or the socket address
    when the header is missing.

    - **Global limit:** 100 requests per minute, shared by every route
      (including unknown routes and, in development, `/api/docs`).
    - **Auth limit:** 3 requests per 5 minutes, applied to
      `POST /api/auth/login` and `POST /api/auth/resend-verification`. Each
      endpoint has its **own** counter per IP.
    - **Per-email cooldown:** see `POST /api/auth/resend-verification`.

    Requests rejected by `express.json()` (malformed JSON, body over 100 KB)
    fail before the limiters and are not counted.

    Every counted response carries the `RateLimit` and `RateLimit-Policy`
    headers (IETF draft 08), one entry per limiter that applies, for example
    `"100-in-1min"` and `"3-in-5min"`. A request over an IP limit gets `429`
    with `errorCode: REQUEST_LIMIT` and a `Retry-After` header.

    ## Email verification
    Users who register with email and password start **unverified**.
    `POST /api/auth/register` emails them a link to
    `GET /api/auth/verify-email?token=<token>` that is valid for 24 hours.
    `POST /api/auth/resend-verification` sends a new link and invalidates the
    previous one. Users who sign up with Google are verified from the start.

    Emails are sent **asynchronously** through a Redis-backed job queue: the
    endpoints respond as soon as the email is queued. A failed send is retried
    up to 3 times with exponential backoff (2 s, 4 s); delivery failures are
    not reported to the client.

    Unverified users can currently log in and use the session like verified
    users; verification is not enforced yet.

    ## Authentication
    `POST /api/auth/login` and a successful Google sign-in set two `HttpOnly`
    cookies, `accessToken` and `refreshToken`, that hold signed JWTs. Browsers
    send them automatically on later requests.

    - `accessToken` lives 15 minutes, `refreshToken` lives 15 days.
    - The access token carries the claims `id`, `email`, `role` (`null` for
      users who signed up with Google and have not picked a role yet), a random
      `jti`, `iat` and `exp`.
    - The refresh token carries only a random `jti`, `iat` and `exp`.
    - Every login starts a new session: a SHA-256 hash of its refresh token is
      stored on the server. A user can have several sessions at once (for
      example, on different devices).
    - When the access token expires, call `POST /api/auth/refresh` to get a new
      pair of tokens. Refresh tokens are **rotated**: each one can be used only
      once.
    - `POST /api/auth/logout` ends the current session: its stored refresh token
      is deleted and both cookies are cleared. Other sessions stay valid.

servers:
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: Auth
    description: Registration and authentication with email and password
  - name: Email verification
    description: Confirming the email address of a registered user
  - name: Google OAuth
    description: Sign-in with a Google account

paths:
  /api/auth/register:
    post:
      tags: [Auth]
      operationId: register
      security: []
      summary: Register a new user
      description: |
        Creates a new user account with the role `student` or `teacher`.

        - Fields are validated in the order `firstName` → `lastName` → `email` →
          `password` → `confirmPassword` → `role`; only the first error is returned.
        - String fields `firstName`, `lastName`, `password` and `confirmPassword` are
          **trimmed** before their length is validated, and the trimmed value is stored.
        - `confirmPassword` must equal `password` after both are trimmed. The
          `Passwords don't match` error is returned only when every other rule passes.
          `confirmPassword` itself is not stored.
        - `email` is **not** trimmed. It is lower-cased before it is stored, so it is
          unique regardless of letter case (`Ada@Example.com` and `ada@example.com` are
          treated as the same address).
        - The password is hashed with SHA-256 and then with bcrypt, so passwords
          longer than 72 bytes are not truncated. It is never returned.
        - Unknown properties (for example `id`) are silently ignored.
        - The user is created **unverified**. A random verification token
          (32 bytes, 64 hex characters) valid for 24 hours is generated; only its
          SHA-256 hash is stored. An email with the link
          `{BACKEND_URL}/api/auth/verify-email?token=<token>` is sent to the user
          (see `GET /api/auth/verify-email`).
        - The user and the token are saved in one transaction, and only then is
          the email queued. If queueing fails (for example, Redis is
          unavailable), the response is `500`, but the user **is** created: a
          new attempt to register gets `409`. Use
          `POST /api/auth/resend-verification` to get a new link. Failures to
          deliver the queued email are not reported.
        - The user is **not** logged in; no cookies are set. Call `POST /api/auth/login`
          afterwards.
      requestBody:
        $ref: '#/components/requestBodies/RegisterRequest'
      responses:
        '201':
          $ref: '#/components/responses/RegisterSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/EmailConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      summary: Log in
      description: |
        Authenticates a user by email and password and sets the session cookies.

        - Fields are validated in the order `email` → `password` with the same rules
          as in `POST /api/auth/register`; only the first error is returned.
        - `email` is lower-cased before lookup, so login is case-insensitive.
          `password` is trimmed before it is compared.
        - Accounts created through Google sign-in have no password and cannot log
          in here; they get the same `401` as a wrong password.
        - Users whose email is not verified yet can log in; verification is not
          checked.
        - On success, the response sets two cookies, both `HttpOnly`, `SameSite=Lax`
          and `Path=/`, plus `Secure` when the server runs in production:
          - `accessToken`: JWT valid for 15 minutes (`Max-Age=900`).
          - `refreshToken`: JWT valid for 15 days (`Max-Age=1296000`).
        - Each successful login starts a new session; sessions started earlier stay
          valid.
        - Unknown properties are silently ignored.
        - **Throttling:** besides the global limit, login is subject to the auth
          limit of 3 requests per 5 minutes per client IP. The counter is
          separate from `POST /api/auth/resend-verification`. It is checked **before**
          validation, so every attempt counts, whether it succeeds, fails
          validation or has wrong credentials.
      requestBody:
        $ref: '#/components/requestBodies/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/LoginSuccess'
        '400':
          $ref: '#/components/responses/LoginBadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/refresh:
    post:
      tags: [Auth]
      operationId: refresh
      security:
        - refreshTokenCookie: []
      summary: Refresh the session tokens
      description: |
        Exchanges a valid refresh token for a new access token and a new refresh
        token.

        - The refresh token is read **only** from the `refreshToken` cookie. A token
          sent in the request body or in the `Authorization` header is ignored.
        - No request body is needed, and any body is ignored. A body that is sent
          as JSON is still parsed, so it must be valid JSON and at most 100 KB
          (see the `400` and `413` responses).
        - The refresh token is accepted only if its JWT signature and expiry are
          valid **and** its session is stored on the server and has not expired.
          An access token cannot be used as a refresh token.
        - The new tokens are built from the current user record, so changes to the
          user (for example, the role or email) are applied.
        - The refresh token is **rotated**: the presented token is replaced by the
          new one and cannot be used again. If the same token is sent in two
          concurrent requests, only one of them succeeds. Other sessions of the
          user are not affected.
        - On success, the response sets the same two cookies as
          `POST /api/auth/login`.
        - On `401`, `404` or `500`, both `accessToken` and `refreshToken` cookies
          are cleared. On `429` the cookies are not changed.
      responses:
        '200':
          $ref: '#/components/responses/RefreshSuccess'
        '400':
          $ref: '#/components/responses/MalformedJsonBody'
        '401':
          $ref: '#/components/responses/RefreshUnauthorized'
        '404':
          $ref: '#/components/responses/RefreshUserNotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/RefreshInternalServerError'

  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      security:
        - refreshTokenCookie: []
        - {}
      summary: Log out
      description: |
        Ends the current session and clears the session cookies.

        - The refresh token is read **only** from the `refreshToken` cookie. A token
          sent in the request body or in the `Authorization` header is ignored. The
          `accessToken` cookie is not needed and is not checked.
        - No request body is needed, and any body is ignored. A body that is sent
          as JSON is still parsed, so it must be valid JSON and at most 100 KB
          (see the `400` and `413` responses).
        - The session whose stored hash matches the refresh token is deleted, so
          the token can no longer be used with `POST /api/auth/refresh`. The JWT is
          **not** verified first: a session is ended even if its token has already
          expired. Other sessions of the user, and sessions of other users, are not
          affected.
        - The operation is **idempotent** and does not require a session. It
          succeeds with `200` when the cookie is missing, empty, not a string (for
          example a `j:`-prefixed JSON cookie), malformed, never issued, or already
          logged out. In those cases no session is deleted.
        - Both `accessToken` and `refreshToken` cookies are cleared on `200` and on
          `500`. On `429` the session is not ended and the cookies are not
          changed.
      responses:
        '200':
          $ref: '#/components/responses/LogoutSuccess'
        '400':
          $ref: '#/components/responses/MalformedJsonBody'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/LogoutInternalServerError'

  /api/auth/google:
    get:
      tags: [Google OAuth]
      operationId: googleSignIn
      security: []
      summary: Start Google sign-in
      description: |
        Starts the Google OAuth 2.0 authorization code flow. Open this URL in the
        browser (by navigation, not `fetch`); it redirects to the Google consent
        screen.

        - A random `state` (32 bytes, 64 hex characters) is generated on every
          request. It is sent to Google in the redirect URL and stored in the
          `google-oauth-state` cookie (`HttpOnly`, `SameSite=Lax`, `Path=/`,
          `Max-Age=600`, plus `Secure` in production).
        - The redirect URL is `https://accounts.google.com/o/oauth2/v2/auth` with
          the query parameters `response_type=code`, `client_id`, `redirect_uri`
          (the server's `GOOGLE_REDIRECT_URI`, which points to
          `GET /api/auth/google/callback`), `scope=openid email profile`, `state`
          and `prompt=consent`.
        - After the user consents or cancels, Google redirects the browser to
          `GET /api/auth/google/callback`.
      responses:
        '302':
          description: Redirect to the Google consent screen.
          headers:
            Location:
              description: Google authorization URL.
              schema:
                type: string
                format: uri
              example: https://accounts.google.com/o/oauth2/v2/auth?response_type=code&client_id=1234.apps.googleusercontent.com&redirect_uri=http%3A%2F%2Flocalhost%3A3000%2Fapi%2Fauth%2Fgoogle%2Fcallback&scope=openid+email+profile&state=9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08&prompt=consent
            Set-Cookie:
              description: The `google-oauth-state` cookie, valid for 10 minutes.
              schema:
                type: string
              example: google-oauth-state=9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08; Max-Age=600; Path=/; HttpOnly; SameSite=Lax
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/google/callback:
    get:
      tags: [Google OAuth]
      operationId: googleCallback
      security:
        - googleOAuthStateCookie: []
      summary: Finish Google sign-in
      description: |
        Redirect target that Google calls after the consent screen. It is not
        meant to be called directly. Except for a malformed query (see `400`)
        or the global rate limit (see `429`), it always answers with a `302`
        redirect to the frontend (`FRONTEND_URL`).

        Steps, in order:

        1. If Google sent `error`, the browser is redirected with
           `error=CANCELED_AUTH` when it is `access_denied` (the user cancelled),
           and with `error=SERVER_ERROR` otherwise. The state is **not** checked
           and the state cookie is **not** cleared.
        2. The `state` query parameter must equal the `google-oauth-state`
           cookie. If either is missing or they differ, the browser is redirected
           with `error=INVALID_STATE` and the state cookie is not cleared.
        3. The state cookie is cleared.
        4. If `code` is missing or empty, the browser is redirected with
           `error=INVALID_GRANT` without contacting Google.
        5. `code` is exchanged with Google for tokens (10 second timeout). If
           Google rejects the code as `invalid_grant` (for example, it was
           already used, has expired or is malformed), the browser is redirected
           with `error=INVALID_GRANT`; any other failure, such as another Google
           error, a timeout or a network error, gives `error=SERVER_ERROR`.
        6. If the Google email is not verified, the browser is redirected with
           `error=EMAIL_UNVERIFIED`.
        7. The user is looked up first by Google account ID (`sub`) and then by
           email:
           - **No user found:** a new user is created with the Google email,
             `firstName` = Google `given_name` (or the full `name` when missing),
             `lastName` = Google `family_name` (or an empty string), no password,
             `role: null`, and the email already **verified**. Such accounts can
             only sign in with Google.
           - **User found by email but not linked to this Google account** (for
             example an email/password account): accounts are **not** linked; the
             browser is redirected with `error=EMAIL_IN_USE`.
           - **User linked to this Google account whose Google email changed:**
             the stored email is updated, unless another user already has the new
             email, in which case the browser is redirected with
             `error=EMAIL_IN_USE`. The tokens issued by this sign-in still carry
             the previous email; it is updated on the next
             `POST /api/auth/refresh`.
        8. A new session is started, the `accessToken` and `refreshToken`
           cookies are set exactly as in `POST /api/auth/login`, and the browser
           is redirected to `FRONTEND_URL` without an `error` parameter.

        Any unexpected error in steps 5–8 (for example, the database is
        unavailable) also redirects with `error=SERVER_ERROR`.

        The email from Google is stored as Google returns it; it is not
        lower-cased.
      parameters:
        - name: code
          in: query
          required: false
          description: Authorization code from Google. Present when the user consented.
          schema:
            type: string
          example: 4/0AVG7fiQ-example-code
        - name: state
          in: query
          required: false
          description: The `state` value sent to Google by `GET /api/auth/google`.
          schema:
            type: string
          example: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
        - name: error
          in: query
          required: false
          description: OAuth error from Google, for example `access_denied` when the user cancelled.
          schema:
            type: string
          example: access_denied
      responses:
        '302':
          description: |
            Redirect to the frontend. On success, the session cookies are set and
            the URL has no `error` parameter. On failure, no session cookies are
            set and the URL carries `error=<OAuthRedirectErrorCode>`.
          headers:
            Location:
              description: |
                `FRONTEND_URL` on success, or `FRONTEND_URL` with an `error` query
                parameter whose value is an `OAuthRedirectErrorCode`.
              schema:
                type: string
                format: uri
              examples:
                success:
                  summary: Signed in
                  value: http://localhost:5173/
                cancelled:
                  summary: User cancelled on the consent screen
                  value: http://localhost:5173/?error=CANCELED_AUTH
                emailInUse:
                  summary: An email/password account already uses this email
                  value: http://localhost:5173/?error=EMAIL_IN_USE
            Set-Cookie:
              description: |
                On success: the `accessToken` and `refreshToken` cookies (as in
                `POST /api/auth/login`) and the cleared `google-oauth-state`
                cookie. After the state check passes, the `google-oauth-state`
                cookie is cleared even if sign-in then fails.
              schema:
                type: string
              example: accessToken=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...; Max-Age=900; Path=/; HttpOnly; SameSite=Lax
        '400':
          $ref: '#/components/responses/OAuthQueryBadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/verify-email:
    get:
      tags: [Email verification]
      operationId: verifyEmail
      security: []
      summary: Verify an email address
      description: |
        Target of the link in the verification email sent by
        `POST /api/auth/register` and `POST /api/auth/resend-verification`. It
        is opened in the browser. Except for a malformed query (see `400`) or
        the global rate limit (see `429`), it always answers with a `302`
        redirect to the frontend (`FRONTEND_URL`).

        Steps, in order:

        1. `token` is trimmed. A missing, empty or whitespace-only token, or a
           token passed more than once, gets a JSON `400`.
        2. The SHA-256 hash of the token is looked up. The token must exist, be
           unused and not expired (tokens live 24 hours). Otherwise the browser
           is redirected with `error=INVALID_VERIFICATION_TOKEN`. The token is
           case-sensitive.
        3. If the user of the token does not exist, the browser is redirected
           with `error=USER_NOT_FOUND`.
        4. If the user is already verified, the browser is redirected with
           `error=EMAIL_ALREADY_VERIFIED` and the token stays unused.
        5. The token is marked as used and the user as verified in one
           transaction, and the browser is redirected to `FRONTEND_URL` without
           an `error` parameter.

        - Each token can be used only once. If the same token is sent in two
          concurrent requests, only one of them succeeds; the other gets
          `error=INVALID_VERIFICATION_TOKEN`.
        - Only the latest token of a user is valid:
          `POST /api/auth/resend-verification` replaces the previous one.
        - Any unexpected error (for example, the database is unavailable)
          redirects with `error=SERVER_ERROR` and leaves the token unused.
        - The user is **not** signed in; no session cookies are set.
      parameters:
        - name: token
          in: query
          required: true
          description: |
            Verification token from the email link: 64 lower-case hex
            characters. Leading and trailing whitespace is trimmed.
          schema:
            type: string
            minLength: 1
          example: 3c1f9a7e5b2d4c6a8e0f1b3d5a7c9e2f4b6d8a0c2e4f6b8d0a2c4e6f8b0d2a4c
      responses:
        '302':
          description: |
            Redirect to the frontend. On success, the URL has no `error`
            parameter. On failure, the URL carries
            `error=<VerifyEmailRedirectErrorCode>`. No cookies are set.
          headers:
            Location:
              description: |
                `FRONTEND_URL` on success, or `FRONTEND_URL` with an `error` query
                parameter whose value is a `VerifyEmailRedirectErrorCode`.
              schema:
                type: string
                format: uri
              examples:
                success:
                  summary: Email verified
                  value: http://localhost:5173/
                invalidToken:
                  summary: Unknown, used or expired token
                  value: http://localhost:5173/?error=INVALID_VERIFICATION_TOKEN
                alreadyVerified:
                  summary: The email is already verified
                  value: http://localhost:5173/?error=EMAIL_ALREADY_VERIFIED
        '400':
          $ref: '#/components/responses/VerifyEmailBadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/resend-verification:
    post:
      tags: [Email verification]
      operationId: resendVerification
      security: []
      summary: Resend the verification email
      description: |
        Sends a new verification link to an unverified user.

        - `email` is validated with the same rules as in
          `POST /api/auth/register` and lower-cased, so the lookup is
          case-insensitive.
        - The response is **always** the same `200` with a generic message, so
          it does not reveal whether an account exists. An email is sent only
          when a user with this email exists and is not verified yet (accounts
          created through Google sign-in are always verified).
        - When an email is sent, the email is queued first and then a new token
          valid for 24 hours replaces the previous one, so links sent earlier
          stop working. The link points to `GET /api/auth/verify-email`. If
          queueing fails, the response is `500` and the previous link stays
          valid.
        - Unknown properties are silently ignored.

        **Throttling.** Checks run in this order:

        1. **Global limit:** 100 requests per minute per client IP (see
           *Rate limiting* above). Checked before validation.
        2. Validation.
        3. **Per-email cooldown:** one request per (lower-cased) email address
           every 60 seconds, whether or not the account exists. A repeated
           request gets `429` with `errorCode: COOLDOWN` and `retryAfter`
           (seconds left) in the body. These requests do not count towards the
           auth limit. The cooldown starts even if the request later fails.
        4. **Auth limit:** 3 requests per 5 minutes per client IP, counted
           separately from `POST /api/auth/login`. Requests over the limit get `429` with
           `errorCode: REQUEST_LIMIT` and a `Retry-After` header.
      requestBody:
        $ref: '#/components/requestBodies/ResendVerificationRequest'
      responses:
        '200':
          $ref: '#/components/responses/ResendVerificationSuccess'
        '400':
          $ref: '#/components/responses/ResendVerificationBadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/ResendVerificationTooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    refreshTokenCookie:
      type: apiKey
      in: cookie
      name: refreshToken
      description: |
        Refresh token JWT set by `POST /api/auth/login`, `POST /api/auth/refresh`
        or a successful Google sign-in. The cookie is `HttpOnly`, so browsers send
        it automatically. It is required by `POST /api/auth/refresh` and optional
        for `POST /api/auth/logout`.

    googleOAuthStateCookie:
      type: apiKey
      in: cookie
      name: google-oauth-state
      description: |
        Random OAuth `state` set by `GET /api/auth/google` for 10 minutes. It
        must match the `state` query parameter of
        `GET /api/auth/google/callback`.

  schemas:
    Role:
      type: string
      description: User role. Case-sensitive.
      enum: [student, teacher]
      example: student

    NullableRole:
      type: string
      description: |
        User role, or `null` for a user who signed up with Google and has not
        picked a role yet. `POST /api/auth/register` and `POST /api/auth/login`
        always return a non-null role.
      enum: [student, teacher, null]
      nullable: true
      example: student

    UserId:
      type: string
      format: uuid
      description: User identifier (UUID v7) generated by the server.
      example: 0199c4a2-7e3b-7a51-9d2f-3b8e6c1a4f07

    FirstName:
      type: string
      description: |
        Given name. Leading and trailing whitespace is trimmed before validation;
        the trimmed value must be 2–100 characters long.
      minLength: 2
      maxLength: 100
      example: Ada

    LastName:
      type: string
      description: |
        Family name. Leading and trailing whitespace is trimmed before validation;
        the trimmed value must be 2–100 characters long.
      minLength: 2
      maxLength: 100
      example: Lovelace

    Email:
      type: string
      format: email
      description: |
        Email address, at most 255 characters. It is not trimmed, so surrounding
        whitespace makes it invalid. The server lower-cases it before storing it.
      maxLength: 255
      pattern: '^(?:[A-Za-z0-9_''+\-]+\.)*[A-Za-z0-9_''+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$'
      example: ada.lovelace@example.com

    Password:
      type: string
      format: password
      description: |
        Plain-text password. Leading and trailing whitespace is trimmed before
        validation; the trimmed value must be 6–255 characters long. An empty or
        whitespace-only value is reported as missing.
      minLength: 6
      maxLength: 255
      writeOnly: true
      example: correct-horse-battery

    ConfirmPassword:
      type: string
      format: password
      description: |
        Repeats `password`. Leading and trailing whitespace is trimmed before
        validation; the trimmed value must be 6–255 characters long and equal to
        the trimmed `password`.
      minLength: 6
      maxLength: 255
      writeOnly: true
      example: correct-horse-battery

    RegisterInput:
      type: object
      description: Payload for creating a new user account.
      required: [firstName, lastName, email, password, confirmPassword, role]
      properties:
        firstName:
          $ref: '#/components/schemas/FirstName'
        lastName:
          $ref: '#/components/schemas/LastName'
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/Password'
        confirmPassword:
          $ref: '#/components/schemas/ConfirmPassword'
        role:
          $ref: '#/components/schemas/Role'

    LoginInput:
      type: object
      description: Credentials for logging in.
      required: [email, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/Password'

    UserDTO:
      type: object
      description: Public representation of a user. Never contains the password.
      required: [id, firstName, lastName, email, role]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/UserId'
        firstName:
          $ref: '#/components/schemas/FirstName'
        lastName:
          $ref: '#/components/schemas/LastName'
        email:
          $ref: '#/components/schemas/Email'
        role:
          $ref: '#/components/schemas/NullableRole'

    UserResponse:
      type: object
      description: Response that wraps the public user representation.
      required: [user]
      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/UserDTO'

    RegisterResponse:
      $ref: '#/components/schemas/UserResponse'

    LoginResponse:
      $ref: '#/components/schemas/UserResponse'

    RefreshResponse:
      type: object
      description: Confirms that the session tokens were refreshed.
      required: [message]
      additionalProperties: false
      properties:
        message:
          type: string
          example: Refreshed

    ResendVerificationInput:
      type: object
      description: Email address to send a new verification link to.
      required: [email]
      properties:
        email:
          $ref: '#/components/schemas/Email'

    ResendVerificationResponse:
      type: object
      description: |
        Generic confirmation. It is the same whether or not an email was sent.
      required: [message]
      additionalProperties: false
      properties:
        message:
          type: string
          enum:
            - If an account with this email exists and isn't verified yet, we've sent a new verification link.
          example: If an account with this email exists and isn't verified yet, we've sent a new verification link.

    TooManyRequests:
      type: object
      description: |
        Body of a `429` response. It has the usual `errorCode` and `message`;
        the per-email cooldown also returns `retryAfter`.
      required: [errorCode, message]
      additionalProperties: false
      properties:
        errorCode:
          type: string
          description: |
            `REQUEST_LIMIT` for a per-IP rate limit, `COOLDOWN` for the
            per-email cooldown of `POST /api/auth/resend-verification`.
          enum: [REQUEST_LIMIT, COOLDOWN]
          example: REQUEST_LIMIT
        message:
          type: string
          description: |
            `Too many requests` for a per-IP limit, or
            `Too many requests. Please try again later.` for the per-email
            cooldown.
          enum:
            - Too many requests
            - Too many requests. Please try again later.
          example: Too many requests
        retryAfter:
          type: integer
          minimum: 0
          maximum: 60
          description: |
            Seconds until the per-email cooldown ends. Present only with
            `errorCode: COOLDOWN`; per-IP limits use the `Retry-After` header.
          example: 42

    ErrorCode:
      type: string
      description: |
        Machine-readable error code. Every value of the shared `ErrorCode` type is
        listed; `ACCOUNT_IN_USE` is reserved and not returned yet.
        `INVALID_VERIFICATION_TOKEN` and `EMAIL_ALREADY_VERIFIED` appear only as
        redirect `error` values of `GET /api/auth/verify-email`, never in a JSON
        body.
      enum:
        - SERVER_ERROR
        - EMAIL_IN_USE
        - INVALID_CREDENTIALS
        - TOKEN_NOT_FOUND
        - INVALID_TOKEN
        - INVALID_VERIFICATION_TOKEN
        - USER_NOT_FOUND
        - EMAIL_UNVERIFIED
        - ACCOUNT_IN_USE
        - CANCELED_AUTH
        - INVALID_STATE
        - INVALID_GRANT
        - VALIDATION_ERROR
        - EMAIL_ALREADY_VERIFIED
        - REQUEST_LIMIT
        - COOLDOWN
      example: EMAIL_IN_USE

    VerifyEmailRedirectErrorCode:
      type: string
      description: |
        Value of the `error` query parameter that `GET /api/auth/verify-email`
        adds to the frontend URL when verification fails.

        - `INVALID_VERIFICATION_TOKEN`: the token is unknown, already used,
          expired, or replaced by a newer one.
        - `USER_NOT_FOUND`: the user of the token no longer exists.
        - `EMAIL_ALREADY_VERIFIED`: the user's email is already verified.
        - `SERVER_ERROR`: any other failure.
      enum:
        - INVALID_VERIFICATION_TOKEN
        - USER_NOT_FOUND
        - EMAIL_ALREADY_VERIFIED
        - SERVER_ERROR
      example: INVALID_VERIFICATION_TOKEN

    OAuthRedirectErrorCode:
      type: string
      description: |
        Value of the `error` query parameter that `GET /api/auth/google/callback`
        adds to the frontend URL when Google sign-in fails.

        - `CANCELED_AUTH`: the user cancelled on the Google consent screen.
        - `INVALID_STATE`: the `state` is missing or does not match the cookie
          (for example, the 10-minute cookie expired).
        - `INVALID_GRANT`: the authorization code is missing or Google rejected
          it.
        - `EMAIL_UNVERIFIED`: the Google account email is not verified.
        - `EMAIL_IN_USE`: another account already uses the Google email.
        - `SERVER_ERROR`: any other failure, including other Google errors.
      enum:
        - CANCELED_AUTH
        - INVALID_STATE
        - INVALID_GRANT
        - EMAIL_UNVERIFIED
        - EMAIL_IN_USE
        - SERVER_ERROR
      example: CANCELED_AUTH

    Error:
      type: object
      description: Error response returned by the global error handler.
      required: [errorCode, message]
      additionalProperties: false
      properties:
        errorCode:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Message that describes the error and can be shown to a user.
          example: User with this email already exists

  requestBodies:
    RegisterRequest:
      required: true
      description: New user data. Must be a JSON object, at most 100 KB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RegisterInput'
          examples:
            student:
              summary: Register a student
              value:
                firstName: Ada
                lastName: Lovelace
                email: ada.lovelace@example.com
                password: correct-horse-battery
                confirmPassword: correct-horse-battery
                role: student
            teacher:
              summary: Register a teacher
              value:
                firstName: Grace
                lastName: Hopper
                email: Grace.Hopper@Navy.mil
                password: C0b0l-1959!
                confirmPassword: C0b0l-1959!
                role: teacher

    LoginRequest:
      required: true
      description: User credentials. Must be a JSON object, at most 100 KB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoginInput'
          example:
            email: ada.lovelace@example.com
            password: correct-horse-battery

    ResendVerificationRequest:
      required: true
      description: Must be a JSON object, at most 100 KB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResendVerificationInput'
          example:
            email: ada.lovelace@example.com

  headers:
    RateLimit:
      description: |
        Remaining quota of each per-IP limit that applies (IETF draft 08),
        comma-separated: `r` is the number of requests left, `t` the seconds
        until the window resets. The global limit is `"100-in-1min"`; the auth
        limit of `POST /api/auth/login` and
        `POST /api/auth/resend-verification` is `"3-in-5min"`.
      schema:
        type: string
      example: '"100-in-1min"; r=99; t=60, "3-in-5min"; r=2; t=300'
    RateLimitPolicy:
      description: |
        Policy of each per-IP limit that applies (IETF draft 08),
        comma-separated: `q` requests per `w` seconds. `pk` is a partition key
        derived from the client IP.
      schema:
        type: string
      example: '"100-in-1min"; q=100; w=60; pk=:ZTNiMGM0NDI5OGZj:, "3-in-5min"; q=3; w=300; pk=:ZTNiMGM0NDI5OGZj:'
    RetryAfter:
      description: |
        Seconds until the exceeded per-IP window resets. Sent only with
        `errorCode: REQUEST_LIMIT`; for the per-email cooldown, use
        `retryAfter` in the body.
      schema:
        type: integer
      example: 42

  responses:
    RegisterSuccess:
      description: User created.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RegisterResponse'
          examples:
            student:
              summary: Student created
              value:
                user:
                  id: 0199c4a2-7e3b-7a51-9d2f-3b8e6c1a4f07
                  firstName: Ada
                  lastName: Lovelace
                  email: ada.lovelace@example.com
                  role: student
            teacher:
              summary: Teacher created (email lower-cased)
              value:
                user:
                  id: 0199c4a3-1c05-7f2e-8b6a-5d41e9f03c2b
                  firstName: Grace
                  lastName: Hopper
                  email: grace.hopper@navy.mil
                  role: teacher

    LoginSuccess:
      description: Logged in. The session cookies are set.
      headers:
        Set-Cookie:
          description: |
            Two cookies are set, one per `Set-Cookie` header:
            `accessToken` (15 minutes) and `refreshToken` (15 days). Both are
            `HttpOnly; SameSite=Lax; Path=/`, and `Secure` in production.
          schema:
            type: string
          example: accessToken=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...; Max-Age=900; Path=/; HttpOnly; SameSite=Lax
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoginResponse'
          example:
            user:
              id: 0199c4a2-7e3b-7a51-9d2f-3b8e6c1a4f07
              firstName: Ada
              lastName: Lovelace
              email: ada.lovelace@example.com
              role: student

    RefreshSuccess:
      description: |
        Tokens refreshed. New session cookies are set and the presented refresh
        token is no longer valid. The tokens are never returned in the body.
      headers:
        Set-Cookie:
          description: |
            Two cookies are set, one per `Set-Cookie` header:
            `accessToken` (15 minutes) and `refreshToken` (15 days). Both are
            `HttpOnly; SameSite=Lax; Path=/`, and `Secure` in production.
          schema:
            type: string
          example: refreshToken=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...; Max-Age=1296000; Path=/; HttpOnly; SameSite=Lax
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RefreshResponse'
          example:
            message: Refreshed

    LogoutSuccess:
      description: |
        Logged out, or there was no session to end. Both session cookies are
        cleared. The body is the plain-text status text `OK`.
      headers:
        Set-Cookie:
          description: |
            Two cookies are cleared, one per `Set-Cookie` header: `accessToken`
            and `refreshToken`, each with an empty value and an expiry date in
            the past.
          schema:
            type: string
          example: refreshToken=; Path=/; Expires=Thu, 01 Jan 1970 00:00:00 GMT; HttpOnly; SameSite=Lax
      content:
        text/plain:
          schema:
            type: string
            enum: [OK]
          example: OK

    BadRequest:
      description: |
        The request body is missing, is not valid JSON, is not a JSON object, or
        fails validation. Only the first validation error is returned. The
        `errorCode` is always `VALIDATION_ERROR`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missingBody:
              summary: Body is missing or not JSON (for example, wrong Content-Type)
              value:
                errorCode: VALIDATION_ERROR
                message: 'Invalid input: expected object, received undefined'
            bodyIsArray:
              summary: Body is a JSON array instead of an object
              value:
                errorCode: VALIDATION_ERROR
                message: 'Invalid input: expected object, received array'
            malformedJson:
              summary: Malformed JSON, or a top-level JSON primitive (for example `"abc"`)
              value:
                errorCode: VALIDATION_ERROR
                message: Invalid JSON payload passed
            firstNameRequired:
              summary: firstName is missing, null or another falsy value (for example `0`)
              value:
                errorCode: VALIDATION_ERROR
                message: First name is required
            firstNameNotString:
              summary: firstName is not a string
              value:
                errorCode: VALIDATION_ERROR
                message: First name should be a string
            firstNameTooShort:
              summary: firstName is shorter than 2 characters after trimming
              value:
                errorCode: VALIDATION_ERROR
                message: First name should be at least 2 characters long
            firstNameTooLong:
              summary: firstName is longer than 100 characters after trimming
              value:
                errorCode: VALIDATION_ERROR
                message: First name should not exceed 100 characters
            lastNameRequired:
              summary: lastName is missing, null or another falsy value (for example `0`)
              value:
                errorCode: VALIDATION_ERROR
                message: Last name is required
            lastNameNotString:
              summary: lastName is not a string
              value:
                errorCode: VALIDATION_ERROR
                message: Last name should be a string
            lastNameTooShort:
              summary: lastName is shorter than 2 characters after trimming
              value:
                errorCode: VALIDATION_ERROR
                message: Last name should be at least 2 characters long
            lastNameTooLong:
              summary: lastName is longer than 100 characters after trimming
              value:
                errorCode: VALIDATION_ERROR
                message: Last name should not exceed 100 characters
            emailRequired:
              summary: email is missing, null or an empty string
              value:
                errorCode: VALIDATION_ERROR
                message: Email is required
            emailInvalid:
              summary: email is not a string or is not a valid address
              value:
                errorCode: VALIDATION_ERROR
                message: Invalid email format
            emailTooLong:
              summary: email is longer than 255 characters
              value:
                errorCode: VALIDATION_ERROR
                message: Email should not exceed 255 characters
            passwordRequired:
              summary: password is missing, null, another falsy value (for example `0`), or empty after trimming
              value:
                errorCode: VALIDATION_ERROR
                message: Password is required
            passwordNotString:
              summary: password is not a string
              value:
                errorCode: VALIDATION_ERROR
                message: Password should be a string
            passwordTooShort:
              summary: password is shorter than 6 characters after trimming
              value:
                errorCode: VALIDATION_ERROR
                message: Password should be at least 6 characters long
            passwordTooLong:
              summary: password is longer than 255 characters after trimming
              value:
                errorCode: VALIDATION_ERROR
                message: Password should not exceed 255 characters
            confirmPasswordRequired:
              summary: confirmPassword is missing, null or another falsy value (for example `0`)
              value:
                errorCode: VALIDATION_ERROR
                message: Password confirmation is required
            confirmPasswordNotString:
              summary: confirmPassword is not a string
              value:
                errorCode: VALIDATION_ERROR
                message: Password confirmation should be a string
            confirmPasswordTooShort:
              summary: confirmPassword is shorter than 6 characters after trimming
              value:
                errorCode: VALIDATION_ERROR
                message: Password confirmation should be at least 6 characters long
            confirmPasswordTooLong:
              summary: confirmPassword is longer than 255 characters after trimming
              value:
                errorCode: VALIDATION_ERROR
                message: Password confirmation should not exceed 255 characters
            roleRequired:
              summary: role is missing, null or an empty string
              value:
                errorCode: VALIDATION_ERROR
                message: Role is required
            roleInvalid:
              summary: role is not `student` or `teacher` (case-sensitive)
              value:
                errorCode: VALIDATION_ERROR
                message: Role 'admin' doesn't exist
            passwordsDontMatch:
              summary: confirmPassword differs from password after trimming (checked last)
              value:
                errorCode: VALIDATION_ERROR
                message: Passwords don't match

    LoginBadRequest:
      description: |
        The request body is missing, is not valid JSON, is not a JSON object, or
        fails validation. Only the first validation error is returned. The
        `errorCode` is always `VALIDATION_ERROR`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missingBody:
              summary: Body is missing or not JSON (for example, wrong Content-Type)
              value:
                errorCode: VALIDATION_ERROR
                message: 'Invalid input: expected object, received undefined'
            malformedJson:
              summary: Malformed JSON, or a top-level JSON primitive (for example `"abc"`)
              value:
                errorCode: VALIDATION_ERROR
                message: Invalid JSON payload passed
            emailRequired:
              summary: email is missing, null or an empty string
              value:
                errorCode: VALIDATION_ERROR
                message: Email is required
            emailInvalid:
              summary: email is not a string or is not a valid address
              value:
                errorCode: VALIDATION_ERROR
                message: Invalid email format
            emailTooLong:
              summary: email is longer than 255 characters
              value:
                errorCode: VALIDATION_ERROR
                message: Email should not exceed 255 characters
            passwordRequired:
              summary: password is missing, null, another falsy value (for example `0`), or empty after trimming
              value:
                errorCode: VALIDATION_ERROR
                message: Password is required
            passwordNotString:
              summary: password is not a string
              value:
                errorCode: VALIDATION_ERROR
                message: Password should be a string
            passwordTooShort:
              summary: password is shorter than 6 characters after trimming
              value:
                errorCode: VALIDATION_ERROR
                message: Password should be at least 6 characters long
            passwordTooLong:
              summary: password is longer than 255 characters after trimming
              value:
                errorCode: VALIDATION_ERROR
                message: Password should not exceed 255 characters

    MalformedJsonBody:
      description: |
        The request has a JSON `Content-Type` but its body is not valid JSON or
        is a top-level JSON primitive. The session cookies are not changed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: VALIDATION_ERROR
            message: Invalid JSON payload passed

    OAuthQueryBadRequest:
      description: |
        A query parameter is not a single string, for example because it is
        repeated (`?state=a&state=b`). No redirect happens and the cookies are
        not changed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: VALIDATION_ERROR
            message: 'Invalid input: expected string, received array'

    VerifyEmailBadRequest:
      description: |
        The `token` query parameter is missing, empty after trimming, or not a
        single string. No redirect happens and no token is used.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missing:
              summary: token is missing
              value:
                errorCode: VALIDATION_ERROR
                message: 'Invalid input: expected string, received undefined'
            empty:
              summary: token is empty or whitespace only
              value:
                errorCode: VALIDATION_ERROR
                message: Token is empty
            repeated:
              summary: token is passed more than once (`?token=a&token=b`)
              value:
                errorCode: VALIDATION_ERROR
                message: 'Invalid input: expected string, received array'

    ResendVerificationSuccess:
      description: |
        Request accepted. A verification email was sent only if an unverified
        user with this email exists.
      headers:
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResendVerificationResponse'
          example:
            message: If an account with this email exists and isn't verified yet, we've sent a new verification link.

    ResendVerificationBadRequest:
      description: |
        The request body is missing, is not valid JSON, is not a JSON object, or
        fails validation. The `errorCode` is always `VALIDATION_ERROR`. Rejected
        requests do not start the per-email cooldown and do not count towards
        the auth limit (they do count towards the global limit).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missingBody:
              summary: Body is missing or not JSON (for example, wrong Content-Type)
              value:
                errorCode: VALIDATION_ERROR
                message: 'Invalid input: expected object, received undefined'
            malformedJson:
              summary: Malformed JSON, or a top-level JSON primitive (for example `"abc"`)
              value:
                errorCode: VALIDATION_ERROR
                message: Invalid JSON payload passed
            emailRequired:
              summary: email is missing, null or an empty string
              value:
                errorCode: VALIDATION_ERROR
                message: Email is required
            emailInvalid:
              summary: email is not a string or is not a valid address
              value:
                errorCode: VALIDATION_ERROR
                message: Invalid email format
            emailTooLong:
              summary: email is longer than 255 characters
              value:
                errorCode: VALIDATION_ERROR
                message: Email should not exceed 255 characters

    ResendVerificationTooManyRequests:
      description: |
        The request is throttled by the global limit, the per-email cooldown or
        the auth limit. No email is sent.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TooManyRequests'
          examples:
            emailCooldown:
              summary: The same email was requested less than 60 seconds ago
              value:
                errorCode: COOLDOWN
                message: Too many requests. Please try again later.
                retryAfter: 42
            ipLimit:
              summary: The client IP exceeded the global or the auth limit
              value:
                errorCode: REQUEST_LIMIT
                message: Too many requests

    TooManyRequests:
      description: |
        The client IP exceeded a rate limit (see *Rate limiting*). The request
        is not processed.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TooManyRequests'
          example:
            errorCode: REQUEST_LIMIT
            message: Too many requests

    RefreshUnauthorized:
      description: |
        The refresh token is missing or cannot be used. Both session cookies are
        cleared.
      headers:
        Set-Cookie:
          description: |
            Two cookies are cleared, one per `Set-Cookie` header: `accessToken`
            and `refreshToken`, each with an empty value and an expiry date in
            the past.
          schema:
            type: string
          example: refreshToken=; Path=/; Expires=Thu, 01 Jan 1970 00:00:00 GMT; HttpOnly; SameSite=Lax
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notAttached:
              summary: |
                The refreshToken cookie is missing, empty, or not a string (for example
                a `j:`-prefixed cookie that is parsed as JSON)
              value:
                errorCode: TOKEN_NOT_FOUND
                message: Refresh token is not attached
            invalidOrExpired:
              summary: |
                The token is malformed, has a bad signature or has expired; its session
                is not stored, has expired or was ended by `POST /api/auth/logout`; or
                it was already rotated
              value:
                errorCode: INVALID_TOKEN
                message: Invalid or expired token

    RefreshUserNotFound:
      description: |
        The session is valid but its user no longer exists. Both session cookies
        are cleared.
      headers:
        Set-Cookie:
          description: |
            Two cookies are cleared, one per `Set-Cookie` header: `accessToken`
            and `refreshToken`, each with an empty value and an expiry date in
            the past.
          schema:
            type: string
          example: refreshToken=; Path=/; Expires=Thu, 01 Jan 1970 00:00:00 GMT; HttpOnly; SameSite=Lax
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: USER_NOT_FOUND
            message: Current user doesn't exist

    EmailConflict:
      description: A user with this email (case-insensitive) already exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: EMAIL_IN_USE
            message: User with this email already exists

    InvalidCredentials:
      description: |
        No user has this email, the password is wrong, or the account has no
        password (it was created through Google sign-in). The same message is
        returned in all cases.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: INVALID_CREDENTIALS
            message: Email or password is incorrect

    PayloadTooLarge:
      description: The request body is larger than 100 KB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: VALIDATION_ERROR
            message: Payload too large

    InternalServerError:
      description: |
        Unexpected server error, such as the database or Redis being
        unavailable, a failure to queue an email, or the server not being
        configured (for example, a missing token signing key or
        `FRONTEND_URL`). A JSON body with a charset other than UTF-8/16/32 or an
        unsupported `Content-Encoding` also gets this response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: SERVER_ERROR
            message: Internal server error!

    RefreshInternalServerError:
      description: |
        Unexpected server error, such as the database being unavailable. A JSON
        body with an unsupported charset or `Content-Encoding` also gets this
        response. Both session cookies are cleared, except for an unsupported
        body, which is rejected before the cookies are read.
      headers:
        Set-Cookie:
          description: |
            Two cookies are cleared, one per `Set-Cookie` header: `accessToken`
            and `refreshToken`, each with an empty value and an expiry date in
            the past.
          schema:
            type: string
          example: accessToken=; Path=/; Expires=Thu, 01 Jan 1970 00:00:00 GMT; HttpOnly; SameSite=Lax
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: SERVER_ERROR
            message: Internal server error!

    LogoutInternalServerError:
      description: |
        Unexpected server error, such as the database being unavailable. Both
        session cookies are still cleared, but the stored session may not have
        been deleted. A JSON body with an unsupported charset or
        `Content-Encoding` also gets this response, but then the cookies are
        not cleared.
      headers:
        Set-Cookie:
          description: |
            Two cookies are cleared, one per `Set-Cookie` header: `accessToken`
            and `refreshToken`, each with an empty value and an expiry date in
            the past.
          schema:
            type: string
          example: accessToken=; Path=/; Expires=Thu, 01 Jan 1970 00:00:00 GMT; HttpOnly; SameSite=Lax
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: SERVER_ERROR
            message: Internal server error!
